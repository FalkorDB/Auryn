# ─────────────────────────────────────────────────────────────────────────────
# Workspace root + umbrella distribution.
#
# The project is a uv workspace: `auryn-core` plus one `auryn-<lang>` package
# per language, each under packages/*, each with its own third-party dependencies so
# a consumer only pays for the languages they install. This root is the umbrella
# `falkordb-auryn` distribution, which depends on every plugin:
#
#     pip install falkordb-auryn                 # batteries-included: every plugin
#     pip install "falkordb-auryn[all]"          # + live-DB drivers (oracledb / postgres / mysql)
#     pip install "auryn-core[python,http]"      # custom: the core + only the plugins named
#
# Every auryn-* requirement is pinned to this release's version (release.yml stamps the pins).
#
# For local development, `uv sync` installs the whole workspace editable (all members
# are in the dev group below), so the full test suite and benchmarks run unchanged.
# ─────────────────────────────────────────────────────────────────────────────

[project]
name = "falkordb-auryn"
version = "0.1.0"
description = "Extracts structural metadata from source code (and SQL databases) into a FalkorDB knowledge graph for AI agent consumption. Umbrella package; language support ships as auryn-<lang> plugins."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = [
    "code-graph", "knowledge-graph", "code-intelligence", "static-analysis",
    "falkordb", "graph-database", "tree-sitter", "ast", "mcp", "ai-agents", "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
    "Operating System :: OS Independent",
]
# Batteries-included: `pip install falkordb-auryn` graphs any repo out of the box -- every file-based
# language plugin + the cross-ingestor hooks (their tree-sitter deps ship prebuilt wheels for every
# platform, incl. Windows). Deliberately NOT hard-depended on here:
#   * the embedded FalkorDB (`auryn-core[embedded]` -> falkordblite) -- POSIX-only, with wheels only for
#     recent-glibc Linux + macOS, so forcing it would break `pip install` on Windows and older-glibc
#     Linux (Ubuntu 22.04 etc.). `auryn quickstart` auto-fetches it at runtime where supported; on
#     native Windows or older-glibc Linux it errors, so point at a remote FalkorDB there. `[embedded]`
#     pre-installs it opt-in (handy for offline / first-run speed; the runtime fetch targets the
#     running interpreter, so it also works under `uv tool install` -- see core.plugins._install_command).
#   * the COMPILED live-DB drivers (oracledb / postgres / mysql) -- opt-in via `[all]`/`[oracle-live]`/
#     `[sql-all]`.
# For a custom install, use `auryn-core[<plugin>,...]` (see packages/core/pyproject.toml).
dependencies = [
    "auryn-core==0.1.0",
    # languages
    "auryn-python==0.1.0",
    "auryn-typescript==0.1.0",
    "auryn-java==0.1.0",
    "auryn-go==0.1.0",
    "auryn-rust==0.1.0",
    "auryn-c==0.1.0",
    "auryn-cpp==0.1.0",
    "auryn-cuda==0.1.0",
    "auryn-csharp==0.1.0",
    "auryn-php==0.1.0",
    "auryn-ruby==0.1.0",
    "auryn-kotlin==0.1.0",
    "auryn-swift==0.1.0",
    "auryn-julia==0.1.0",
    "auryn-bash==0.1.0",
    # database schemas (file-based; the live-DB drivers are the extras below)
    "auryn-sql==0.1.0",
    "auryn-oracle==0.1.0",
    # cross-language links
    "auryn-http==0.1.0",
    "auryn-orm==0.1.0",
    "auryn-grpc==0.1.0",
    "auryn-events==0.1.0",
    # deployment
    "auryn-docker==0.1.0",
]

[project.urls]
Homepage = "https://github.com/FalkorDB/Auryn"
Repository = "https://github.com/FalkorDB/Auryn"
Documentation = "https://github.com/FalkorDB/Auryn/tree/main/docs"
Issues = "https://github.com/FalkorDB/Auryn/issues"

[project.optional-dependencies]
# Only the heavy optional parts; every plugin is already a dependency above.
embedded = ["auryn-core[embedded]==0.1.0"]      # serverless, in-process FalkorDB (no server/Docker); powers `auryn quickstart`
oracle-live = ["auryn-oracle[live]==0.1.0"]     # + oracledb for the live `oracle` PL/SQL ingestor
sql-all = ["auryn-sql[all]==0.1.0"]             # + postgres/mysql/oracle DBAPI drivers pre-installed
all = [                                         # every live-DB driver
    "auryn-oracle[live]==0.1.0",
    "auryn-sql[all]==0.1.0",
]

# Re-declare the CLI entry point on the umbrella so `uv tool install falkordb-auryn` (or a published
# name / a local path / `.[all]`) exposes the `auryn` executable. uv tool install only
# installs entry points from the *named* package, not its dependencies -- without this it
# resolves everything then removes the tool ("no executables provided"). The target module lives
# in the `auryn-core` dependency, which is always installed alongside, so the console script
# resolves at runtime.
[project.scripts]
auryn = "auryn.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The umbrella has no code of its own -- it's a pure dependency aggregator.
[tool.hatch.build.targets.wheel]
bypass-selection = true

# ── uv workspace ─────────────────────────────────────────────────────────────
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
auryn-core = { workspace = true }
auryn-python = { workspace = true }
auryn-csharp = { workspace = true }
auryn-oracle = { workspace = true }
auryn-sql = { workspace = true }
auryn-http = { workspace = true }
auryn-orm = { workspace = true }
auryn-grpc = { workspace = true }
auryn-events = { workspace = true }
auryn-docker = { workspace = true }
auryn-c = { workspace = true }
auryn-cpp = { workspace = true }
auryn-cuda = { workspace = true }
auryn-typescript = { workspace = true }
auryn-java = { workspace = true }
auryn-go = { workspace = true }
auryn-rust = { workspace = true }
auryn-php = { workspace = true }
auryn-julia = { workspace = true }
auryn-ruby = { workspace = true }
auryn-kotlin = { workspace = true }
auryn-swift = { workspace = true }
auryn-bash = { workspace = true }

[dependency-groups]
# `uv sync` installs these by default -> the whole workspace, editable, for dev/CI.
dev = [
    "auryn-core",
    "auryn-python",
    "auryn-csharp",
    "auryn-oracle[live]",
    "auryn-sql[all]",
    "auryn-http",
    "auryn-orm",
    "auryn-grpc",
    "auryn-events",
    "auryn-docker",
    "auryn-c",
    "auryn-cpp",
    "auryn-cuda",
    "auryn-typescript",
    "auryn-java",
    "auryn-go",
    "auryn-rust",
    "auryn-php",
    "auryn-julia",
    "auryn-ruby",
    "auryn-kotlin",
    "auryn-swift",
    "auryn-bash",
    "falkordblite>=0.10",   # so the embedded/serverless FalkorDB path (auryn quickstart) is exercised in CI
    "pytest>=8.0",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",    # parallel test execution (addopts `-n auto`); each worker gets its own embedded FalkorDB
    "testcontainers>=4.8",
]

# ── test + coverage ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# Run the suite in parallel by default (pytest-xdist). Each worker is its own process with its own
# session-scoped embedded FalkorDB (falkordblite) + tmp dir + uuid graph names, so workers are fully
# isolated -- no shared port/home/state (home-dir tests pin AURYN_HOME to a tmp dir, and conftest's
# _isolate_cache_home pins the on-disk cache per test). `auto` scales to the host's cores (~6x on an
# 11-core dev box, ~2x on a 2-core CI runner). `--dist loadgroup` keeps tests tagged with the same
# xdist_group on ONE worker: conftest.pytest_collection_modifyitems tags each container/SDK-backed
# test by resource, so a DB testcontainer (or the Roslyn extractor) is built once, not once per worker
# -- ungrouped tests still spread normally. Override with `-n0` to run serially (the container-backed
# CI integration job does; also handy when debugging).
addopts = "-n auto --dist loadgroup"
filterwarnings = [
    # Third-party deprecation we don't control: testcontainers' own OracleDbContainer.start()
    # calls the deprecated wait_for_logs(str) internally (our fixtures already use the new
    # LogMessageWaitStrategy API where WE do the waiting). Scoped to this exact message so it
    # never masks a deprecation from our own code. Drop it once testcontainers fixes it upstream.
    "ignore:The wait_for_logs function with string or callable predicates is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = [
    "packages/core/src/auryn",
    "packages/python/src/auryn",
    "packages/csharp/src/auryn",
    "packages/oracle/src/auryn",
    "packages/sql/src/auryn",
    "packages/http/src/auryn",
    "packages/docker/src/auryn",
    "packages/c/src/auryn",
    "packages/cpp/src/auryn",
    "packages/cuda/src/auryn",
    "packages/typescript/src/auryn",
    "packages/java/src/auryn",
    "packages/go/src/auryn",
    "packages/rust/src/auryn",
    "packages/php/src/auryn",
    "packages/julia/src/auryn",
]
branch = true
omit = ["*/ingestors/plsql/grammar/*"]

[tool.coverage.report]
show_missing = true
