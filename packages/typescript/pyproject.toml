[project]
name = "auryn-typescript"
dynamic = ["version"]
description = "TypeScript/JavaScript language plugin for Auryn: one fast tree-sitter engine over the whole JS/TS family (.ts/.tsx/.js/.jsx/.mjs/.cjs), extracting classes/interfaces/enums/type-aliases/functions/methods/params, the ES-module import graph, and calls. A deep tsserver/TS-compiler pass (resolved types, cross-module calls) is the planned second phase."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "tree-sitter>=0.26.0",
    # ships language_typescript() + language_tsx(); the tsx grammar also parses plain JS/JSX.
    "tree-sitter-typescript>=0.23.2",
]

# Import-light lazy GitLanguage (no tree-sitter import at discovery). See core/registry.py.
# One language ("typescript") owns the whole JS/TS family -- TS is a syntactic superset of JS,
# and resolution is global, so a `.ts` importing a `.js` module must resolve within one pass.
# The TS vs JS distinction is preserved as a `dialect` property on Module nodes, not by
# splitting into two languages.
[project.entry-points."auryn.languages"]
typescript = "auryn.ingestors.typescript.plugin"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

# ── version: derived from git (hatch-vcs) ────────────────────────────────────
# Every commit -- and every build of a modified tree (local part `+g<sha>.d<timestamp>`) -- gets
# its own version, and uv's build cache is keyed on the git commit and the source files (by default
# it only watches pyproject.toml). Together these stop `uv tool install --force <clone>` from
# silently reinstalling a stale cached build. An sdist keeps the version it was built with, and a
# `git archive` / GitHub ZIP reads it from .git_archival.txt; a tree with neither falls back to
# 0.0.0.dev0 -- a development version, so it can't pass for a release.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
raw-options = { root = "../..", local_scheme = "node-and-timestamp" }

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" }, { git = { commit = true, tags = true } },
    { file = "src/**/*.py" }, { file = "src/**/*.js" }, { file = "src/**/*.md" }, { file = "src/**/*.cs" }, { file = "src/**/*.html" }, { file = "src/**/*.css" }, { file = "src/**/*.csproj" },
]
