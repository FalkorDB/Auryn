[project]
name = "auryn-sql"
dynamic = ["version"]
description = "Generic relational-database schema ingestor for Auryn: reflects any SQLAlchemy-supported engine (PostgreSQL, MySQL/MariaDB, SQLite, Oracle, ...) into Database/Schema/Table/Column/View/Sequence/Index/Constraint nodes plus foreign-key edges, via SQLAlchemy's dialect-agnostic Inspector. Dialect-specific DBAPI drivers are optional extras, auto-installed on demand."
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "click>=8.1",
    # The generic driver layer -- one dialect-agnostic Inspector reflects every engine.
    "sqlalchemy>=2.0",
]

# Per-engine DBAPI drivers. SQLAlchemy needs one for the DSN's dialect; a live run
# imports it on demand and auto-installs the right one (core.plugins.ensure_importable),
# so these extras are a convenience/offline pre-install, not a hard requirement. SQLite
# needs none (it's in Python's stdlib), so it works out of the box with just this package.
[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1"]
oracle = ["oracledb>=4.0.2"]
all = ["psycopg2-binary>=2.9", "pymysql>=1.1", "oracledb>=4.0.2"]

# A live-source BaseIngestor, driven by `auryn run sql` -- registered in the
# `auryn.ingestors` group so the file-scan ingest endpoint never imports SQLAlchemy;
# only the `auryn run` CLI path loads it. See core/registry.py.
[project.entry-points."auryn.ingestors"]
sql = "auryn.ingestors.sql.ingestor"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

# ── version: derived from git (hatch-vcs) ────────────────────────────────────
# Every commit -- and every build of a modified tree (local part `+g<sha>.d<timestamp>`) -- gets
# its own version, and uv's build cache is keyed on the git commit and the source files (by default
# it only watches pyproject.toml). Together these stop `uv tool install --force <clone>` from
# silently reinstalling a stale cached build. An sdist keeps the version it was built with, and a
# `git archive` / GitHub ZIP reads it from .git_archival.txt; a tree with neither falls back to
# 0.0.0 -- never a number that could pass for a release.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
raw-options = { root = "../..", local_scheme = "node-and-timestamp" }

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" }, { git = { commit = true, tags = true } },
    { file = "src/**/*.py" }, { file = "src/**/*.js" }, { file = "src/**/*.md" }, { file = "src/**/*.cs" }, { file = "src/**/*.html" }, { file = "src/**/*.css" }, { file = "src/**/*.csproj" },
]
