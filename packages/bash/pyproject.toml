[project]
name = "auryn-bash"
version = "0.1.0"
description = "Bash/Shell language plugin for Auryn: a fast tree-sitter-bash engine extracting the functions a script defines, the local-functions and external commands each invokes (CALLS), and `source`/`.` includes (IMPORTS). Bash has no types/classes, so the model is deliberately flat (File -> Function -> calls). A deep pass (a real shell resolver / shellcheck-style analysis) is a possible future second phase."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "SSPL-1.0" }
dependencies = [
    "auryn-core",
    "tree-sitter>=0.26.0",
    "tree-sitter-bash>=0.25.0",
]

# Import-light lazy GitLanguage (no tree-sitter import at discovery). See core/registry.py.
[project.entry-points."auryn.languages"]
bash = "auryn.ingestors.bash.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]
