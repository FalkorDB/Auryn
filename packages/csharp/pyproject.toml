[project]
name = "auryn-csharp"
dynamic = ["version"]
description = "C# language plugin for Auryn: fast tree-sitter parse + deep Roslyn extractor (bundled source, built on demand; requires the .NET SDK)."
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "click>=8.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-c-sharp>=0.23.5",
]

# `auryn.languages` -> import-light lazy GitLanguage (no tree-sitter/Roslyn at
# discovery); `auryn.ingestors` -> the live-DB CSharpIngestor, loaded only by
# `auryn run`. See core/registry.py.
[project.entry-points."auryn.languages"]
csharp = "auryn.ingestors.csharp.plugin"

[project.entry-points."auryn.ingestors"]
csharp = "auryn.ingestors.csharp.ingestor"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]
# Ship the bundled Roslyn extractor's source (.cs/.csproj) but never any local build output.
exclude = ["**/roslyn_extractor/bin/**", "**/roslyn_extractor/obj/**"]

# ── version: derived from git (hatch-vcs) ────────────────────────────────────
# Every commit -- and every build of a modified tree (local part `+g<sha>.d<timestamp>`) -- gets
# its own version, and uv's build cache is keyed on the git commit and the source files (by default
# it only watches pyproject.toml). Together these stop `uv tool install --force <clone>` from
# silently reinstalling a stale cached build. Without git (an sdist/tarball) it falls back to 0.1.0.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"
raw-options = { root = "../..", local_scheme = "node-and-timestamp" }

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" }, { git = { commit = true, tags = true } },
    { file = "src/**/*.py" }, { file = "src/**/*.js" }, { file = "src/**/*.md" }, { file = "src/**/*.cs" }, { file = "src/**/*.html" }, { file = "src/**/*.css" }, { file = "src/**/*.csproj" },
]
