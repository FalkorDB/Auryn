[project]
name = "auryn-k8s"
version = "0.1.0"
description = "Kubernetes-manifest plugin for Auryn and the third producer of the deployment & infrastructure tier (ADR 0007). Parses k8s manifests into Service (workload) nodes that RUNS_IMAGE the shared Image hub, and Ingress route nodes; a `deploy-k8s` enrichment joins each Ingress route to the HTTP seam's route-keyed APIEndpoint (SERVES) -- so an external URL reaches the handler that serves it -- and runs the shared image lifecycle. Composes with auryn-docker/auryn-compose onto the same hub. Depends only on auryn-core."
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "pyyaml>=6.0",
]

[project.entry-points."auryn.languages"]
k8s = "auryn.ingestors.k8s.plugin"

[project.entry-points."auryn.enrichments"]
deploy-k8s = "auryn.ingestors.k8s.enrichment"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

[tool.uv.sources]
auryn-core = { workspace = true }
