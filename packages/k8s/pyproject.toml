[project]
name = "auryn-k8s"
version = "0.1.0"
description = "Kubernetes-manifest plugin for Auryn (deployment & infrastructure tier, ADR 0007). Parses k8s manifests into Service (workload) nodes that RUNS_IMAGE the shared Image hub, and Ingress route nodes. A `deploy-k8s` enrichment keys each Ingress route to the HTTP seam's route-keyed APIEndpoint: the Ingress ROUTES to it and the backing workload SERVES it, so an external URL reaches its handler. Composes with auryn-docker/auryn-compose onto the same hub. Depends on auryn-core and PyYAML."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "pyyaml>=6.0",
]

[project.entry-points."auryn.languages"]
k8s = "auryn.ingestors.k8s.plugin"

[project.entry-points."auryn.enrichments"]
deploy-k8s = "auryn.ingestors.k8s.enrichment"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

[tool.uv.sources]
auryn-core = { workspace = true }
