[project]
name = "auryn-go"
version = "0.1.0"
description = "Go language plugin for Auryn: a fast tree-sitter-go engine extracting packages/structs/interfaces/functions/methods/fields/params/consts, Go embedding (EMBEDS), and calls. IMPLEMENTS (structural interface satisfaction) and precise cross-file type resolution are the planned deep pass (a go/types or gopls-backed engine)."
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "tree-sitter>=0.26.0",
    "tree-sitter-go>=0.25.0",
]

# Import-light lazy GitLanguage (no tree-sitter import at discovery). See core/registry.py.
[project.entry-points."auryn.languages"]
go = "auryn.ingestors.go.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]
