[project]
name = "auryn-python"
version = "0.1.0"
description = "Python language plugin for Auryn: fast `ast` + deep Jedi (in-process) engines, plus the web-framework route enrichment."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "jedi>=0.20.0",
]

# Entry points are split by concern (core/registry.py): `auryn.languages` targets the
# import-light plugin module (a lazy GitLanguage -- no engine import at discovery), while
# `auryn.enrichments` targets the route-synthesis pass.
[project.entry-points."auryn.languages"]
python = "auryn.ingestors.python.plugin"

[project.entry-points."auryn.enrichments"]
pyframework = "auryn.ingestors.pyframework"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]
