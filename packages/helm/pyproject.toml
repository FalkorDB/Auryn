[project]
name = "auryn-helm"
dynamic = ["version"]
description = "Helm-chart plugin for Auryn (deployment & infrastructure tier, ADR 0007). Render-free: parses Chart.yaml/values.yaml/templates into a Resource (the chart/release) that DEPENDS_ON its chart dependencies and DEPLOYS the Service workloads its templates declare; each workload RUNS_IMAGE the shared Image hub, with the image resolved from values.yaml. Composes with auryn-docker/auryn-compose/auryn-k8s/auryn-terraform onto the same hub. Depends on auryn-core and PyYAML."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "pyyaml>=6.0",
]

[project.entry-points."auryn.languages"]
helm = "auryn.ingestors.helm.plugin"

[project.entry-points."auryn.enrichments"]
deploy-helm = "auryn.ingestors.helm.enrichment"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

[tool.uv.sources]
auryn-core = { workspace = true }

# ── version: derived from git (hatch-vcs) ────────────────────────────────────
# Every commit -- and every build of a modified tree (local part `+g<sha>.d<timestamp>`) -- gets
# its own version, and uv's build cache is keyed on the git commit and the source files (by default
# it only watches pyproject.toml). Together these stop `uv tool install --force <clone>` from
# silently reinstalling a stale cached build. An sdist keeps the version it was built with, and a
# `git archive` / GitHub ZIP reads it from .git_archival.txt; a tree with neither falls back to
# 0.0.0.dev0 -- a development version, so it can't pass for a release.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
raw-options = { root = "../..", local_scheme = "node-and-timestamp" }

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" }, { git = { commit = true, tags = true } },
    { file = "src/**/*.py" }, { file = "src/**/*.js" }, { file = "src/**/*.md" }, { file = "src/**/*.cs" }, { file = "src/**/*.html" }, { file = "src/**/*.css" }, { file = "src/**/*.csproj" },
]
