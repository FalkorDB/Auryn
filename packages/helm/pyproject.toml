[project]
name = "auryn-helm"
version = "0.1.0"
description = "Helm-chart plugin for Auryn (deployment & infrastructure tier, ADR 0007). Render-free static parse: Chart.yaml + values.yaml become a Resource (the chart/release) that DEPENDS_ON its chart dependencies (in-repo chart else a placeholder), RUNS_IMAGE the shared Image hub for each values.yaml image, and MOUNTS the chart's notable ConfigValues. A deploy-helm enrichment runs the shared image lifecycle. Composes with docker/compose/k8s/terraform onto the same hub. Depends on auryn-core and PyYAML."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "pyyaml>=6.0",
]

[project.entry-points."auryn.languages"]
helm = "auryn.ingestors.helm.plugin"

[project.entry-points."auryn.enrichments"]
deploy-helm = "auryn.ingestors.helm.enrichment"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

[tool.uv.sources]
auryn-core = { workspace = true }
