[project]
name = "auryn-helm"
version = "0.1.0"
description = "Helm-chart plugin for Auryn (deployment & infrastructure tier, ADR 0007). Render-free: parses Chart.yaml/values.yaml/templates into a Resource (the chart/release) that DEPENDS_ON its chart dependencies and DEPLOYS the Service workloads its templates declare; each workload RUNS_IMAGE the shared Image hub, with the image resolved from values.yaml. Composes with auryn-docker/auryn-compose/auryn-k8s/auryn-terraform onto the same hub. Depends on auryn-core and PyYAML."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "pyyaml>=6.0",
]

[project.entry-points."auryn.languages"]
helm = "auryn.ingestors.helm.plugin"

[project.entry-points."auryn.enrichments"]
deploy-helm = "auryn.ingestors.helm.enrichment"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

[tool.uv.sources]
auryn-core = { workspace = true }
