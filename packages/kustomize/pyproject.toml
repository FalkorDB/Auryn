[project]
name = "auryn-kustomize"
version = "0.1.0"
description = "Kustomize plugin for Auryn (deployment & infrastructure tier, ADR 0007). Render-free: parses kustomization.yaml into a Resource (overlay/base) that RUNS_IMAGE the shared Image hub for each ref its images: transformer sets (newName/newTag/digest), and DEPENDS_ON the base kustomizations it layers on (resources/bases/components). A deploy-kustomize enrichment runs the shared image lifecycle. Composes with docker/compose/k8s/terraform/helm onto the same hub. Depends on auryn-core and PyYAML."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "pyyaml>=6.0",
]

[project.entry-points."auryn.languages"]
kustomize = "auryn.ingestors.kustomize.plugin"

[project.entry-points."auryn.enrichments"]
deploy-kustomize = "auryn.ingestors.kustomize.enrichment"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

[tool.uv.sources]
auryn-core = { workspace = true }
