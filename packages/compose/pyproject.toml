[project]
name = "auryn-compose"
dynamic = ["version"]
description = "Docker Compose plugin for Auryn (deployment & infrastructure tier, ADR 0007). Parses docker-compose files into Service nodes (RUNS_IMAGE the shared Image hub, DEPENDS_ON other services). A `deploy-compose` enrichment links each service that has both `build:` and `image:` to the Dockerfile stage it builds (`build.target`, else the final stage) with BUILDS_IMAGE, marking the image resolved/internal; the stages come from auryn-docker, so install both. Depends on auryn-core and PyYAML."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "pyyaml>=6.0",
]

# Import-light lazy GitLanguage (no PyYAML import at discovery).
[project.entry-points."auryn.languages"]
compose = "auryn.ingestors.compose.plugin"

# The `deploy-compose` stitch (ADR 0007), run after the language ingestors. Opt-out via
# `auryn hooks enable/disable deploy-compose`.
[project.entry-points."auryn.enrichments"]
deploy-compose = "auryn.ingestors.compose.enrichment"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

[tool.uv.sources]
auryn-core = { workspace = true }

# ── version: derived from git (hatch-vcs) ────────────────────────────────────
# Every commit -- and every build of a modified tree (local part `+g<sha>.d<timestamp>`) -- gets
# its own version, and uv's build cache is keyed on the git commit and the source files (by default
# it only watches pyproject.toml). Together these stop `uv tool install --force <clone>` from
# silently reinstalling a stale cached build. An sdist keeps the version it was built with, and a
# `git archive` / GitHub ZIP reads it from .git_archival.txt; a tree with neither falls back to
# 0.0.0.dev0 -- a development version, so it can't pass for a release.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
raw-options = { root = "../..", local_scheme = "node-and-timestamp" }

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" }, { git = { commit = true, tags = true } },
    { file = "src/**/*.py" }, { file = "src/**/*.js" }, { file = "src/**/*.md" }, { file = "src/**/*.cs" }, { file = "src/**/*.html" }, { file = "src/**/*.css" }, { file = "src/**/*.csproj" },
]
