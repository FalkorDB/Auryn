[project]
name = "auryn-cuda"
version = "0.1.0"
description = "CUDA language plugin for Auryn: a fast tree-sitter-cuda engine. CUDA is a strict superset of C++, so this plugin reuses the auryn-cpp extraction engine verbatim (namespaces/classes/structs/unions/enums/methods/fields/params, the type hierarchy, templates, #includes/macros, calls -- including out-of-line Class::method definitions) and adds the CUDA-only graph signal: an `execution_space` property on kernels/device/host functions (__global__/__device__/__host__) and a LAUNCHES edge for `kernel<<<grid, block>>>(...)` launches. A deep libclang/nvcc pass is the planned second phase."
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "auryn-cpp",                 # the shared C++ extraction engine (CUDA is a superset)
    "tree-sitter>=0.26.0",
    "tree-sitter-cuda>=0.21.2",
]

# Import-light lazy GitLanguage (no tree-sitter import at discovery). See core/registry.py.
[project.entry-points."auryn.languages"]
cuda = "auryn.ingestors.cuda.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]
