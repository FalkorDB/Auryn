[project]
name = "auryn-cuda"
dynamic = ["version"]
description = "CUDA language plugin for Auryn: a fast tree-sitter-cuda engine. CUDA is a superset of C++, so it reuses the auryn-cpp extraction engine verbatim (namespaces/classes/structs/enums/methods/fields/params, type hierarchy, templates, includes/macros, calls) and adds the CUDA-only graph signals: an `execution_space` property (`__global__`/`__device__`/`__host__`) and a LAUNCHES edge for `kernel<<<...>>>` launches. A deep libclang/nvcc pass is the planned second phase."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "auryn-cpp==0.1.0",          # the shared C++ extraction engine (CUDA is a superset)
    "tree-sitter>=0.26.0",
    "tree-sitter-cuda>=0.21.2",
]

# Import-light lazy GitLanguage (no tree-sitter import at discovery). See core/registry.py.
[project.entry-points."auryn.languages"]
cuda = "auryn.ingestors.cuda.plugin"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

# ── version: derived from git (hatch-vcs) ────────────────────────────────────
# Every commit -- and every build of a modified tree (local part `+g<sha>.d<timestamp>`) -- gets
# its own version, and uv's build cache is keyed on the git commit and the source files (by default
# it only watches pyproject.toml). Together these stop `uv tool install --force <clone>` from
# silently reinstalling a stale cached build. An sdist keeps the version it was built with, and a
# `git archive` / GitHub ZIP reads it from .git_archival.txt; a tree with neither falls back to
# 0.0.0.dev0 -- a development version, so it can't pass for a release.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
raw-options = { root = "../..", local_scheme = "node-and-timestamp" }

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" }, { git = { commit = true, tags = true } },
    { file = "src/**/*.py" }, { file = "src/**/*.js" }, { file = "src/**/*.md" }, { file = "src/**/*.cs" }, { file = "src/**/*.html" }, { file = "src/**/*.css" }, { file = "src/**/*.csproj" },
]
