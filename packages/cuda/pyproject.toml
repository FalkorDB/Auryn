[project]
name = "auryn-cuda"
version = "0.1.0"
description = "CUDA language plugin for Auryn: reuses the auryn-cpp engine and adds kernel execution-space and kernel-launch (LAUNCHES) signals."
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "SSPL-1.0" }
dependencies = [
    "auryn-core",
    "auryn-cpp",                 # the shared C++ extraction engine (CUDA is a superset)
    "tree-sitter>=0.26.0",
    "tree-sitter-cuda>=0.21.2",
]

# Import-light lazy GitLanguage (no tree-sitter import at discovery). See core/registry.py.
[project.entry-points."auryn.languages"]
cuda = "auryn.ingestors.cuda.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]
