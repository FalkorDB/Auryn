[project]
name = "auryn-ci"
version = "0.1.0"
description = "CI plugin for Auryn (deployment & infrastructure tier, ADR 0007). Parses GitHub Actions workflows (.github/workflows/*.yml) into a Resource (the pipeline) that BUILDS_IMAGE the shared Image hub for each image its steps build or push (docker/build-push-action tags, docker build -t / docker push). That edge flips a hub image resolved/internal, closing the build->image->run loop the docker producer defers to CI. A deploy-ci enrichment runs the shared image lifecycle. Depends on auryn-core and PyYAML."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "pyyaml>=6.0",
]

[project.entry-points."auryn.languages"]
ci = "auryn.ingestors.ci.plugin"

[project.entry-points."auryn.enrichments"]
deploy-ci = "auryn.ingestors.ci.enrichment"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

[tool.uv.sources]
auryn-core = { workspace = true }
