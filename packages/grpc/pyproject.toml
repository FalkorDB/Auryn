[project]
name = "auryn-grpc"
version = "0.1.0"
description = "Language-agnostic gRPC/Protobuf contract stitch for Auryn: a post-ingestion hook that parses .proto service contracts and links a client's RPC call and a server's handler Method to the shared contract across languages (caller -CALLS_RPC-> RpcMethod <-IMPLEMENTS_RPC- handler). The RPC analog of the HTTP call<->endpoint seam; ties microservices written in different languages. Depends only on auryn-core."
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
]

# A post-ingestion hook, registered in the `auryn.enrichments` group so the ingest endpoint
# discovers and runs it after the language ingestors (full + incremental), opt-out via
# `auryn hooks enable/disable grpc-contract`.
[project.entry-points."auryn.enrichments"]
grpc = "auryn.ingestors.grpc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

[tool.uv.sources]
auryn-core = { workspace = true }
