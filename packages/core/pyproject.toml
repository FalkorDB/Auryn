[project]
name = "auryn-core"
version = "0.1.0"
description = "Core of Auryn: registry/plugin discovery, git+local sources, the FalkorDB graph layer, the MCP server, the viewer, and the `auryn` CLI. Language support ships as separate `auryn-<lang>` plugins."
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "falkordb>=1.5.0",
    "click>=8.1",
    "flask>=3.1.3",
    "gitpython>=3.1.57",
    # <2.1 deliberately: mcp 2.1 masks tool exceptions as a generic "Error executing
    # tool X", dropping our helpful ValueError messages (missing-node id, "call
    # locate() first"). Revisit as its own task -- see MCP error-surfacing follow-up.
    "mcp>=1.2,<2.1",
    "tomli-w>=1.0",  # write ~/.auryn/config.toml (install manifest); reads use stdlib tomllib
]

[project.optional-dependencies]
# Optional AI enrichment for the viewer: naming detected graph communities via
# Claude (viewer/community_names.py). Imported lazily and degraded gracefully, so
# the viewer runs fine without it -- install `auryn-core[llm]` + set
# ANTHROPIC_API_KEY to enable semantic community names.
llm = ["anthropic>=0.40"]
# Optional embedded/serverless FalkorDB: bundles Redis + the FalkorDB module in-process
# (no separate server, no Docker) via falkordblite. Imported lazily -- and auto-installed
# on demand (opt-out) -- in graph_client.connect_client only when a config requests
# embedded mode, so the normal server path never carries it. Powers `auryn quickstart`.
embedded = ["falkordblite>=0.10"]
# Plugins, for a custom install: `pip install "auryn-core[python,http]"`. Each extra is named
# after its package (`auryn-<name>`) and pinned to this release's version (release.yml stamps
# the pins with the version). `pip install falkordb-auryn` installs all of them.
# languages
python = ["auryn-python==0.1.0"]
typescript = ["auryn-typescript==0.1.0"]       # also .js/.jsx/.mjs/.cjs
java = ["auryn-java==0.1.0"]
go = ["auryn-go==0.1.0"]
rust = ["auryn-rust==0.1.0"]
c = ["auryn-c==0.1.0"]
cpp = ["auryn-cpp==0.1.0"]
cuda = ["auryn-cuda==0.1.0"]                   # reuses the C++ engine (pulls auryn-cpp)
csharp = ["auryn-csharp==0.1.0"]
php = ["auryn-php==0.1.0"]
ruby = ["auryn-ruby==0.1.0"]
kotlin = ["auryn-kotlin==0.1.0"]
swift = ["auryn-swift==0.1.0"]
julia = ["auryn-julia==0.1.0"]
bash = ["auryn-bash==0.1.0"]
# database schemas
sql = ["auryn-sql==0.1.0"]                     # relational-DB schemas (SQLAlchemy; SQLite works out of the box)
sql-all = ["auryn-sql[all]==0.1.0"]            # + postgres/mysql/oracle DBAPI drivers
oracle = ["auryn-oracle==0.1.0"]               # file-based PL/SQL + SQL DDL, no DB driver
oracle-live = ["auryn-oracle[live]==0.1.0"]    # + oracledb for the live `oracle` ingestor
# cross-language links
http = ["auryn-http==0.1.0"]                   # HTTP client call <-> server endpoint
orm = ["auryn-orm==0.1.0"]                     # ORM model <-> DB table
grpc = ["auryn-grpc==0.1.0"]                   # gRPC client call <-> server handler
events = ["auryn-events==0.1.0"]               # message publisher <-> subscriber (Kafka/Rabbit/NATS/...)
# deployment
docker = ["auryn-docker==0.1.0"]               # Dockerfiles + the `deploy` stitch (ADR 0007)
# every plugin + both live-DB drivers: the same as `pip install "falkordb-auryn[all]"`
all = [
    "auryn-python==0.1.0",
    "auryn-typescript==0.1.0",
    "auryn-java==0.1.0",
    "auryn-go==0.1.0",
    "auryn-rust==0.1.0",
    "auryn-c==0.1.0",
    "auryn-cpp==0.1.0",
    "auryn-cuda==0.1.0",
    "auryn-csharp==0.1.0",
    "auryn-php==0.1.0",
    "auryn-ruby==0.1.0",
    "auryn-kotlin==0.1.0",
    "auryn-swift==0.1.0",
    "auryn-julia==0.1.0",
    "auryn-bash==0.1.0",
    "auryn-sql[all]==0.1.0",
    "auryn-oracle[live]==0.1.0",
    "auryn-http==0.1.0",
    "auryn-orm==0.1.0",
    "auryn-grpc==0.1.0",
    "auryn-events==0.1.0",
    "auryn-docker==0.1.0",
]

[project.scripts]
auryn = "auryn.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PEP 420 namespace package: there is no src/auryn/__init__.py, so several
# distributions (this core + each auryn-<lang>) all contribute submodules to the
# shared `auryn` namespace. hatchling maps src/auryn/** -> auryn/** and
# includes the viewer's static assets (non-.py) that live under the tree.
[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]
