[project]
name = "auryn-rust"
version = "0.1.0"
description = "Rust language plugin for Auryn: a fast tree-sitter-rust engine extracting modules/structs/enums/traits/functions/methods/fields/variants/params/consts, the trait hierarchy (IMPLEMENTS/EXTENDS), and calls. An optional deep pass resolves calls precisely via rust-analyzer's SCIP index (trait dispatch, generics, cross-module/crate), degrading to the fast pass when unavailable."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "tree-sitter>=0.26.0",
    "tree-sitter-rust>=0.24.2",
]

# Import-light lazy GitLanguage (no tree-sitter import at discovery). See core/registry.py.
[project.entry-points."auryn.languages"]
rust = "auryn.ingestors.rust.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]
