[project]
name = "auryn-events"
dynamic = ["version"]
description = "Language-agnostic message/event-bus stitch for Auryn: a post-ingestion hook that ties a publisher to a subscriber through the topic/queue they share (publisher -PUBLISHES_TO-> Topic <-SUBSCRIBES_TO- subscriber) across Kafka/RabbitMQ/NATS/Redis-style brokers -- a decoupled connection that has no call edge in the graph. Depends only on auryn-core."
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
]

# A post-ingestion hook, registered in the `auryn.enrichments` group so the ingest endpoint
# discovers and runs it after the language ingestors (full + incremental), opt-out via
# `auryn hooks enable/disable message-bus`.
[project.entry-points."auryn.enrichments"]
events = "auryn.ingestors.events"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

[tool.uv.sources]
auryn-core = { workspace = true }

# ── version: derived from git (hatch-vcs) ────────────────────────────────────
# Every commit -- and every build of a modified tree (local part `+g<sha>.d<timestamp>`) -- gets
# its own version, and uv's build cache is keyed on the git commit and the source files (by default
# it only watches pyproject.toml). Together these stop `uv tool install --force <clone>` from
# silently reinstalling a stale cached build. Without git (an sdist/tarball) it falls back to 0.1.0.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"
raw-options = { root = "../..", local_scheme = "node-and-timestamp" }

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" }, { git = { commit = true, tags = true } },
    { file = "src/**/*.py" }, { file = "src/**/*.js" }, { file = "src/**/*.md" }, { file = "src/**/*.cs" }, { file = "src/**/*.html" }, { file = "src/**/*.css" }, { file = "src/**/*.csproj" },
]
