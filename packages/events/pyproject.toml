[project]
name = "auryn-events"
version = "0.1.0"
description = "Language-agnostic message/event-bus stitch for Auryn: a post-ingestion hook that ties a publisher to a subscriber through the topic/queue they share (publisher -PUBLISHES_TO-> Topic <-SUBSCRIBES_TO- subscriber) across Kafka/RabbitMQ/NATS/Redis-style brokers -- a decoupled connection that has no call edge in the graph. Depends only on auryn-core."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
]

# A post-ingestion hook, registered in the `auryn.enrichments` group so the ingest endpoint
# discovers and runs it after the language ingestors (full + incremental), opt-out via
# `auryn hooks enable/disable message-bus`.
[project.entry-points."auryn.enrichments"]
events = "auryn.ingestors.events"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

[tool.uv.sources]
auryn-core = { workspace = true }
