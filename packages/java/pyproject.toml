[project]
name = "auryn-java"
version = "0.1.0"
description = "Java language plugin for Auryn: a fast tree-sitter-java engine extracting packages/classes/interfaces/enums/records/methods/fields/params, the type hierarchy (EXTENDS/IMPLEMENTS), and calls. A deep pass (Eclipse JDT / javac symbol resolution) is the planned second phase."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "auryn-core",
    "tree-sitter>=0.26.0",
    "tree-sitter-java>=0.23.5",
]

# Import-light lazy GitLanguage (no tree-sitter import at discovery). See core/registry.py.
[project.entry-points."auryn.languages"]
java = "auryn.ingestors.java.plugin"

# Post-ingestion enrichment: Spring MVC route endpoints (the Java analogue of pyframework).
[project.entry-points."auryn.enrichments"]
javaframework = "auryn.ingestors.javaframework"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]
