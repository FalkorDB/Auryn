[project]
name = "auryn-docker"
dynamic = ["version"]
description = "Dockerfile plugin for Auryn and the first producer of the deployment & infrastructure tier (ADR 0007). A dependency-free Dockerfile parser emits BuildStage nodes, the shared image-keyed `Image` hub (the FROM chain, as resolved:false placeholders) and multi-stage COPY --from edges; a `deploy` enrichment links build stages to the code they package (PACKAGES), recomputes image `resolved` and GCs orphan images. Compose/k8s/Helm/Terraform producers join onto the hub. Depends only on auryn-core."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
# No parser dependency: the Dockerfile grammar is small enough to tokenize by hand (file_parser.py),
# which keeps the plugin dependency-free and its tests hermetic. A tree-sitter-dockerfile engine
# would slot in behind `parse_source` (ADR 0007 §7) and add its dep here then.
dependencies = [
    "auryn-core",
]

# Import-light lazy GitLanguage (no parser import at discovery). See core/registry.py.
[project.entry-points."auryn.languages"]
docker = "auryn.ingestors.docker.plugin"

# The `deploy` cross-artifact stitch (ADR 0007), registered so the ingest endpoint runs it after the
# language ingestors (full + incremental). Opt-out via `auryn hooks enable/disable deploy`.
[project.entry-points."auryn.enrichments"]
deploy = "auryn.ingestors.docker.enrichment"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

[tool.uv.sources]
auryn-core = { workspace = true }

# ── version: derived from git (hatch-vcs) ────────────────────────────────────
# Every commit -- and every build of a modified tree (local part `+g<sha>.d<timestamp>`) -- gets
# its own version, and uv's build cache is keyed on the git commit and the source files (by default
# it only watches pyproject.toml). Together these stop `uv tool install --force <clone>` from
# silently reinstalling a stale cached build. An sdist keeps the version it was built with, and a
# `git archive` / GitHub ZIP reads it from .git_archival.txt; a tree with neither falls back to
# 0.0.0.dev0 -- a development version, so it can't pass for a release.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"
raw-options = { root = "../..", local_scheme = "node-and-timestamp" }

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" }, { git = { commit = true, tags = true } },
    { file = "src/**/*.py" }, { file = "src/**/*.js" }, { file = "src/**/*.md" }, { file = "src/**/*.cs" }, { file = "src/**/*.html" }, { file = "src/**/*.css" }, { file = "src/**/*.csproj" },
]
