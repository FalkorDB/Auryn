[project]
name = "auryn-php"
version = "0.1.0"
description = "PHP language plugin for Auryn: a fast tree-sitter-php engine extracting namespaces/classes/interfaces/traits/enums/functions/methods/properties/constants/params, the type hierarchy (EXTENDS/IMPLEMENTS/USES_TRAIT), and calls. A deep pass (full name-resolution: use-statement aliasing, autoloading, inherited-member calls) is the planned second phase."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "SSPL-1.0" }
dependencies = [
    "auryn-core",
    "tree-sitter>=0.26.0",
    "tree-sitter-php>=0.24.0",
]

# Import-light lazy GitLanguage (no tree-sitter import at discovery). See core/registry.py.
[project.entry-points."auryn.languages"]
php = "auryn.ingestors.php.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]
