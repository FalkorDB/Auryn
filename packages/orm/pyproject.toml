[project]
name = "auryn-orm"
version = "0.1.0"
description = "Language-agnostic ORM model<->database-table stitch for Auryn: a post-ingestion hook that joins a SQLAlchemy model class (in a code graph) to the physical Table/Column nodes a SQL ingestor produced (in a schema graph), by table/column name. Forms the code->database connection across two ingestors so a query can trace a function -> its ORM model -> the real table. Depends only on auryn-core."
readme = "README.md"
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "SSPL-1.0" }
dependencies = [
    "auryn-core",
]

# A post-ingestion hook, registered in the `auryn.enrichments` group so the ingest endpoint
# discovers and runs it after the language ingestors (full + incremental), opt-out via
# `auryn hooks enable/disable orm-tables`.
[project.entry-points."auryn.enrichments"]
orm = "auryn.ingestors.orm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]

[tool.uv.sources]
auryn-core = { workspace = true }
