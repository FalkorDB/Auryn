[project]
name = "auryn-swift"
version = "0.1.0"
description = "Swift language plugin for Auryn: a fast tree-sitter-swift engine extracting classes/structs/enums/protocols/functions/methods/initializers/properties/params/cases, the type hierarchy (EXTENDS/IMPLEMENTS from superclass + protocol conformance, including via extensions), imports, and calls. A deep pass (SourceKit-LSP symbol resolution) is the planned second phase."
authors = [{ name = "Roi Lipman", email = "roi.lipman@falkordb.com" }]
requires-python = ">=3.12"
license = { text = "SSPL-1.0" }
dependencies = [
    "auryn-core",
    "tree-sitter>=0.26.0",
    "tree-sitter-swift>=0.7.3",
]

# Import-light lazy GitLanguage (no tree-sitter import at discovery). See core/registry.py.
[project.entry-points."auryn.languages"]
swift = "auryn.ingestors.swift.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auryn"]
