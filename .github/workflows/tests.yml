name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:      # lets release.yml invoke the whole suite as a pre-publish gate

# Least privilege: the suite only needs to read the checked-out code.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The only test areas that reach outside the process for a Docker container or the .NET SDK.
  # Kept here once so the fast `test` job (which skips them) and the `integration` job (which
  # runs exactly them) can't drift about what "heavy" means:
  #   - plsql        -> Oracle XE testcontainer
  #   - sql live     -> PostgreSQL + MySQL testcontainers (self-skip without Docker)
  #   - csharp roslyn -> publishes the net8.0 Roslyn extractor (self-skips without `dotnet`)
  # Everything else runs against the serverless embedded FalkorDB (falkordblite) with no server.
  HEAVY_TESTS: >-
    tests/ingestors/plsql/test_plsql_ingestor.py
    tests/ingestors/sql/test_sql_live_engines.py
    tests/ingestors/csharp/test_roslyn.py

jobs:
  # Fast signal on every push/PR: the whole workspace suite on the embedded FalkorDB backend,
  # no Docker, no .NET. This is the bulk of the 700+ tests.
  test:
    runs-on: ubuntu-latest
    services:
      # The suite runs against the in-process embedded FalkorDB by default, but one test
      # (tests/core/test_clone_into_cwd.py) drives the `ingest repo` CLI against a real server on
      # localhost:6379. Provide one so it passes; every other test still uses the embedded backend.
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Installs the whole workspace editable (all language plugins + test deps) using the
      # pinned Python from .python-version and the locked dependency set from uv.lock.
      - name: Sync workspace
        run: uv sync --frozen

      - name: Run core suite (embedded FalkorDB)
        # Cap parallelism at -n 2 (overriding the pyproject `-n auto` default): each xdist worker
        # runs its own in-process embedded FalkorDB, and `auto` on a hosted runner can exhaust
        # memory and fail unrelated to the test -- which, since release.yml gates publishing on this
        # suite, could flake-block a release. 2 keeps a speedup without the memory pressure.
        run: |
          ignores=""
          for t in $HEAVY_TESTS; do ignores="$ignores --ignore=$t"; done
          uv run pytest $ignores -n 2 --cov=auryn --cov-report=term-missing

  # Install what users install -- the umbrella, and the core with a few plugin extras -- from wheels
  # built from THIS checkout, then run `pip check`, the CLI, and check that the expected plugins load.
  # The packages are stamped with a version that exists only here, and every auryn-* requirement is
  # pinned `==`, so every auryn-* package comes from the local build and third-party ones from PyPI.
  package-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec:
          - "falkordb-auryn"            # default: everything
          - "falkordb-auryn[all]"       # + the live-DB drivers
          - "auryn-core"                # core only
          - "auryn-core[python]"        # custom: one plugin
          - "auryn-core[http,sql]"      # custom: several plugins
          - "auryn-core[cuda]"          # a plugin that pulls another (auryn-cpp)
          - "auryn-core[all]"           # the same as falkordb-auryn[all]
    env:
      LOCAL_VERSION: "0.0.0.dev0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build every package at a local-only version
        run: |
          python .github/scripts/stamp_version.py "$LOCAL_VERSION"
          mkdir -p "$RUNNER_TEMP/dist"
          uv build --out-dir "$RUNNER_TEMP/dist" .
          for d in packages/*/; do
            uv build --out-dir "$RUNNER_TEMP/dist" "$d"
          done

      - name: Install ${{ matrix.spec }} and verify
        env:
          SPEC: ${{ matrix.spec }}
        run: |
          python -m venv "$RUNNER_TEMP/package-env"
          env_bin="$RUNNER_TEMP/package-env/bin"
          "$env_bin/python" -m pip install --find-links "$RUNNER_TEMP/dist" "${SPEC}==${LOCAL_VERSION}"
          "$env_bin/python" -m pip check
          "$env_bin/auryn" --help > /dev/null
          "$env_bin/python" - <<'PY'
          import os, pathlib, re
          from importlib.metadata import entry_points, requires
          # The exact plugin set: every plugin in packages/ for the umbrella and auryn-core[all];
          # auryn-a and auryn-b for auryn-core[a,b], plus the plugins they need (auryn-cuda -> auryn-cpp).
          name, _, extras = os.environ["SPEC"].partition("[")
          extras = [e for e in extras.rstrip("]").split(",") if e]
          if name == "falkordb-auryn" or "all" in extras:
              expected = {f"auryn-{p.parent.name}" for p in pathlib.Path("packages").glob("*/pyproject.toml")}
          else:
              expected = {f"auryn-{e}" for e in extras}
              needed = [r for plugin in expected for r in requires(plugin) or [] if "extra ==" not in r]
              expected |= {re.match(r"[\w.-]+", r).group() for r in needed if r.startswith("auryn-")}
          expected.discard("auryn-core")
          loaded = set()
          for group in ("auryn.languages", "auryn.ingestors", "auryn.enrichments"):
              for ep in entry_points(group=group):
                  ep.load()
                  loaded.add(ep.dist.name)
          assert loaded == expected, f"expected plugins {sorted(expected)}, loaded {sorted(loaded)}"
          print(f"{len(loaded)} plugins loaded: {sorted(loaded)}")
          PY

  # Dedicated performance-regression gate. The whole value of delta-sync is that editing one file
  # re-parses ~one file, not the repo -- a change that drags a file's whole package/module back in is
  # still node-for-node correct (the `test` job passes) but slow. `test_delta_blast_radius.py` catches
  # exactly that by asserting on FILES RE-PARSED (deterministic -- no wall-clock flake on a shared
  # runner), across every delta-capable language. It already runs inside the `test` job, but that job
  # is `-n auto` (parallel), where the in-process embedded backend can exhaust memory and fail for
  # reasons unrelated to perf; running the guard here SERIALLY (-n0) gives a clean, isolated signal so a
  # real blast-radius regression is an unambiguous red check, not noise lost in a parallel-suite flake.
  # (The benchmarks/ suite measures wall-clock throughput and clones real repos -- useful locally, too
  # flaky/slow to GATE CI, so it stays out of here by design.)
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync workspace
        run: uv sync --frozen

      - name: Delta-sync blast-radius perf gate (serial, deterministic)
        run: uv run pytest tests/sync/test_delta_blast_radius.py -n0 -q

  # The container/SDK-backed integration tests, isolated so their slower setup can't hold up
  # the fast signal above. ubuntu-latest ships a running Docker daemon (used by testcontainers).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync workspace
        run: uv sync --frozen

      - name: Run integration suite (Oracle / PostgreSQL / MySQL / Roslyn)
        # -n0 overrides the default `-n auto` (pyproject addopts): these tests share session-scoped
        # Oracle/PostgreSQL/MySQL testcontainers that must NOT be spun up once per xdist worker.
        run: uv run pytest $HEAVY_TESTS -n0

  # Windows coverage for the real surface Windows USERS exercise: the CLI, every language
  # parser/file_parser, config/ids/schema/registry, the SCIP readers+resolvers, the cross-ingestor
  # stitches, and the git-info pure functions -- the whole backend-free suite, run serially.
  #
  # The embedded FalkorDB (redislite/falkordblite) is POSIX-only and there is no native Windows
  # redis/valkey server, so DB-backed tests can't run here: they SKIP automatically (the
  # falkordb_connection fixture in tests/conftest.py pytest.skip()s on os.name == "nt", and the
  # embedded-only modules guard with pytest.importorskip). Windows users point Auryn at a REMOTE
  # FalkorDB (AURYN_TEST_BACKEND=server) -- that path shares the exact same code as embedded, which
  # the Linux jobs above already exercise. The dev group is excluded because it pulls falkordblite;
  # the language plugins still install (they're the umbrella's own dependencies).
  #
  # Excluded here, each kept running on Linux (the `test`/`integration` jobs):
  #   - the HEAVY_TESTS trio -- Oracle/PostgreSQL/MySQL testcontainers + the .NET Roslyn extractor,
  #     none of which GitHub's Windows runner provides (same rationale as the Linux split).
  # Everything else that genuinely can't run on Windows self-skips at the test level with a reason
  # (POSIX symlink privilege, a #!/bin/sh git hook, PATH lookup of an extensionless shell script).
  #
  # Deliberately NOT a required check while stabilizing; flip it to required once it's reliably green.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync workspace without the dev group (falkordblite is POSIX-only)
        run: uv sync --frozen --no-group dev

      - name: Run the backend-free suite (DB tests skip; container/SDK tests excluded)
        # `--with pytest` adds just the runner (no xdist/cov/benchmark -- they're in the excluded dev
        # group), `-o addopts=""` drops the pyproject `-n auto --dist loadgroup` default so it runs
        # serially with no plugins needed. `--continue-on-collection-errors` keeps a single import
        # failure from aborting the whole session (so one run surfaces every problem), and `-rs`
        # lists skip reasons so the DB/POSIX skips are visible in the log.
        run: >
          uv run --no-sync --with pytest pytest tests
          --ignore=tests/ingestors/plsql/test_plsql_ingestor.py
          --ignore=tests/ingestors/sql/test_sql_live_engines.py
          --ignore=tests/ingestors/csharp/test_roslyn.py
          -o addopts=""
          -p no:cacheprovider
          --continue-on-collection-errors
          -rs
