name: release

# Builds every distribution (the `falkordb-auryn` umbrella + every `auryn-*` package under
# packages/) and publishes them to PyPI in one lockstep release using Trusted Publishing.
#
# Publishing is GATED on the full test suite (tests.yml, reused): if the suite is red, neither
# publish job runs, so a broken version can't be released.
#
# Two ways to run it:
#   * Cut a GitHub Release (tag `vX.Y.Z`)  -> builds that version and publishes to PyPI.
#   * Manually (workflow_dispatch)         -> pick TestPyPI (dry run) or PyPI, and a version.
#
# ONE-TIME SETUP:
#   1. On each existing PyPI project, add a GitHub trusted publisher: owner `FalkorDB`,
#      repository `Auryn`, workflow `release.yml`, environment `pypi`.
#   2. Repeat on TestPyPI with environment `testpypi`.
#   3. For projects not yet present on either index, register one pending publisher at a time
#      with the corresponding settings above. Run this workflow against that index with
#      `bootstrap_project` set to its project name, then repeat for each remaining project.
#      Pending publishers sharing one workflow/environment cannot be registered simultaneously,
#      and their minted tokens only authorize the pending project.
# Configure appropriate protection rules for the `pypi` and `testpypi` GitHub environments.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      version:
        description: "Version to build (e.g. 0.2.0). Blank = derive from the release tag."
        type: string
        default: ""
      bootstrap_project:
        description: "Optional: publish only this project to create it with a pending publisher."
        type: string
        default: ""

# Only the publish jobs can request an OIDC token.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Full test suite (tests.yml, reused) — a hard gate: nothing publishes unless it passes.
  # Runs in parallel with `build`; the publish jobs below require BOTH to succeed.
  test:
    uses: ./.github/workflows/tests.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Resolve version (dispatch input, else release tag)
        id: ver
        run: |
          v="${{ github.event.inputs.version }}"
          [ -z "$v" ] && v="${GITHUB_REF_NAME#v}"
          [ -z "$v" ] && { echo "::error::could not resolve a version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing version $v"

      - name: Stamp the version into every auryn-* pin (single source of truth = the tag)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        # Rewrites every `auryn-*==` pin (umbrella deps, core extras). The packages' own versions
        # come from git; the build below holds them at this same version.
        run: python .github/scripts/stamp_version.py "$VERSION"

      - name: Build the umbrella + every member package
        env:
          # Versions are derived from git (hatch-vcs, see the pyproject files). A release builds
          # every package at the ONE version resolved above -- single source of truth = the tag --
          # whatever `git describe` would say about this checkout.
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          rm -rf dist && mkdir -p dist
          uv build --out-dir dist .                    # falkordb-auryn (umbrella)
          for d in packages/*/; do
            uv build --out-dir dist "$d"               # auryn-core + every language/feature dist
          done

      - name: Sanity check — one wheel per workspace package (+ umbrella), all at one version
        run: |
          ls -1 dist
          n=$(ls -1 dist/*.whl | wc -l)
          members=$(ls -1d packages/*/ | wc -l)
          expected=$(( members + 1 ))   # every packages/* member + the umbrella
          echo "built $n wheels; expected $expected ($members members + umbrella)"
          test "$n" -eq "$expected" || { echo "::error::expected $expected wheels, got $n"; exit 1; }
          # A wheel is built from its sdist, where there is no git: catch a package that fell back
          # to another version (or still carries a fixed one) instead of publishing a mismatched
          # set. Compared with each other, not with the tag: the built name is the normalized
          # form (`0.4.0-rc.1` -> `0.4.0rc1`).
          versions=$(ls -1 dist | sed -E 's/^.+-([^-]+)(-py3-none-any\.whl|\.tar\.gz)$/\1/' | sort -u)
          echo "version(s) built: $versions"
          if [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
            ls -1 dist | sed -E 's/^(.+)-([^-]+)(-py3-none-any\.whl|\.tar\.gz)$/\2  &/' | sort
            echo "::error::built more than one version"; exit 1
          fi

      - name: Select a single project for pending publisher bootstrap
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_project != '' }}
        env:
          PROJECT: ${{ inputs.bootstrap_project }}
        run: |
          python - <<'PY'
          import os, pathlib, re

          normalize = lambda name: re.sub(r"[-_.]+", "-", name).lower()
          project = normalize(os.environ["PROJECT"])
          files = list(pathlib.Path("dist").iterdir())
          selected = [f for f in files if normalize(f.name.split("-", 1)[0]) == project]
          if not any(f.name.endswith(".whl") for f in selected) or not any(
              f.name.endswith(".tar.gz") for f in selected
          ):
              raise SystemExit(f"::error::No wheel and sdist found for {project}")
          for f in files:
              if f not in selected:
                  f.unlink()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Manual dry run: workflow_dispatch with target=testpypi.
  publish-testpypi:
    needs: [build, test]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi' }}
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: false

  # Real publish: on a GitHub Release, or manual dispatch with target=pypi.
  publish-pypi:
    needs: [build, test]
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          attestations: false
