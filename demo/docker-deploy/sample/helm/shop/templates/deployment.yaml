apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: shop-api
  template:
    metadata:
      labels:
        app: shop-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
